server:
  address: http://192.168.1.50:5000

apis:
  weather: "YOUR_OPENWEATHER_API_KEY"

  # Multiple RSS feeds for news
  news_feeds:
    - "http://feeds.bbci.co.uk/news/rss.xml"                # BBC World
    - "https://news.google.com/rss?hl=en-IN&ceid=IN:en"     # Google News India (English)
    - "https://www.amarujala.com/rss/uttar-pradesh.xml"     # Amar Ujala Uttar Pradesh
    - "https://www.amarujala.com/rss/kanpur.xml"            # Amar Ujala Kanpur city feed
    - "https://www.abpananda.abplive.in/rss/kolkata.xml"    # ABP Ananda Kolkata (Bengali)

  sports: "YOUR_CRICKET_API_KEY"
  podcast: "https://api.podcastindex.org"

  youtube: "yt-dlp"
  youtube_runtime: "quickjs"

  jiosaavn: "enabled"
  gaana: "enabled"

  # Speech recognition (ASR)
  asr_url: "https://api.openai.com/v1/audio/transcriptions"
  asr_key: "YOUR_ASR_API_KEY"

  # Text-to-speech (TTS)
  tts_url: "https://api.elevenlabs.io/v1/tts"
  tts_key: "YOUR_TTS_API_KEY"

voice:
  wake_word: "Alexa"
  languages:
    default: bn
    supported: [bn, hi, en]

models:
  gemini:
    provider: "Gemini"
    api_key: "YOUR_GEMINI_API_KEY"
  chatgpt:
    provider: "ChatGPT"
    api_key: "YOUR_CHATGPT_API_KEY"
  qwen:
    provider: "Qwen"
    api_key: "YOUR_QWEN_API_KEY"
